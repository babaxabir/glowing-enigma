name: Daily Market Sentiment

on:
  schedule:
    # Every day at 8:00 AM UTC
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check NTFY_TOPIC secret
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "::error title=Missing NTFY_TOPIC secret::Go to Settings → Secrets and variables → Actions → New repository secret. Name: NTFY_TOPIC. Value: your ntfy topic name (e.g. market-sentiment-a8f3k2). It must match the topic you subscribed to in the ntfy app."
            exit 1
          fi

      - name: Send daily sentiment notification
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: python -m sentiment.main
